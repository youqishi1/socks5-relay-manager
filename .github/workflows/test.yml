name: relay-tests
on:
  push:
  workflow_dispatch:
    inputs:
      public_bootstrap:
        description: 'Validate published public v1.5.0 bootstrap anonymously'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.public_bootstrap != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Decode offline TUIC PNG and terminal QR with an independent reader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-opencv zbar-tools
          python3 tests/test_qr.py
      - name: Bash syntax and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n start.sh install.sh scripts/install_common.sh socks-menu.sh uninstall.sh tests/test-install.sh tests/test-centos7-vm.sh tests/test-debian-vm.sh tests/test-acme.sh
          shellcheck -x start.sh install.sh scripts/install_common.sh socks-menu.sh uninstall.sh tests/test-install.sh tests/test-centos7-vm.sh tests/test-debian-vm.sh tests/test-acme.sh
      - name: Release integrity, update menus and installer fault cases
        run: |
          python3 tests/test_updates.py
          python3 tests/test_install_helpers.py
          python3 tests/test_diagnostics.py
          python3 tests/test_reachability.py
          python3 tools/build_release.py
          git diff --exit-code -- start.sh
      - name: Actual nginx webroot discovery with an existing website
        run: |
          sudo apt-get install -y --no-install-recommends nginx
          sudo env NGINX_BINARY=/usr/sbin/nginx python3 tests/test_webroot_nginx.py
      - name: Fresh install, repeat install and real systemd
        run: sudo env RELAY_DISPOSABLE_HOST=YES bash tests/test-install.sh
      - name: Real core integration suite
        run: sudo python3 tests/test_relay.py
      - name: Real domain certificate HTTP-01 and renewal
        run: sudo env RELAY_DISPOSABLE_HOST=YES bash tests/test-acme.sh
      - name: Download pinned official client test binaries
        run: |
          mkdir -p "$RUNNER_TEMP/relay-clients"
          cd "$RUNNER_TEMP/relay-clients"
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz -o sing-box.tar.gz
          echo 'a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  sing-box.tar.gz' | sha256sum -c -
          tar -xzf sing-box.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o mihomo.gz
          echo '8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  mihomo.gz' | sha256sum -c -
          gzip -dk mihomo.gz
          chmod +x mihomo
          echo "SINGBOX_BINARY=$RUNNER_TEMP/relay-clients/sing-box-1.14.2-linux-amd64/sing-box" >> "$GITHUB_ENV"
          echo "MIHOMO_BINARY=$RUNNER_TEMP/relay-clients/mihomo" >> "$GITHUB_ENV"
      - name: Real TUIC client chains and exporter security
        run: sudo --preserve-env=SINGBOX_BINARY,MIHOMO_BINARY python3 tests/test_clients.py
      - name: Real automatically installed encrypted TCP and TUIC
        run: sudo --preserve-env=SINGBOX_BINARY,MIHOMO_BINARY python3 tests/test_access.py
      - name: UDP-only entrances, real clients and independent HTTP3 masquerade
        run: |
          sudo apt-get install -y --no-install-recommends python3-aioquic
          sudo --preserve-env=SINGBOX_BINARY,MIHOMO_BINARY python3 tests/test_profiles.py
      - name: Real published rollback, upgrade and SS/TUIC diagnosis
        run: sudo env RELAY_DISPOSABLE_HOST=YES python3 tests/test_update_systemd.py
      - name: Authenticated private-repository one-command bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          SOCKS_REPO_REF: ${{ github.sha }}
        run: |
          gh api "repos/youqishi1/socks5-relay-manager/tarball/$SOCKS_REPO_REF" > "$RUNNER_TEMP/relay-source.tar.gz"
          mkdir "$RUNNER_TEMP/relay-source"
          tar -xzf "$RUNNER_TEMP/relay-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/relay-source"
          sudo bash "$RUNNER_TEMP/relay-source/install.sh" --local
      - name: Service diagnostics on failure
        if: failure()
        run: |
          sudo journalctl -u 'socks-relay@*' --no-pager -n 80
          sudo sh -c 'for file in /var/log/socks5-relay-manager/service-*.log; do [ ! -f "$file" ] || tail -n 30 "$file"; done'
  public-install:
    if: github.event_name == 'workflow_dispatch' && inputs.public_bootstrap == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous fixed-version public bootstrap
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/youqishi1/socks5-relay-manager/v1.5.0/start.sh -o "$RUNNER_TEMP/socks-relay-setup.sh"
          sudo bash "$RUNNER_TEMP/socks-relay-setup.sh"
          test "$(sudo cat /opt/socks5-relay-manager/current/VERSION)" = 1.5.0
      - name: Installed release real systemd and repeat-install verification
        run: sudo env RELAY_DISPOSABLE_HOST=YES python3 tests/test_systemd.py
  centos7:
    if: github.event_name != 'workflow_dispatch' || inputs.public_bootstrap != true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/relay-centos-runtime.tar.gz
            ${{ runner.temp }}/relay-centos-runtime.tar.gz.sha256
          key: relay-centos7-python3.12.15-openssl3.5.9-3proxy0.9.9.0-v1
      - name: Install VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Original CentOS 7 kernel and systemd integration
        run: env RELAY_DISPOSABLE_HOST=YES RELAY_CENTOS_CACHE="$RUNNER_TEMP/relay-centos-runtime.tar.gz" bash tests/test-centos7-vm.sh
  debian:
    if: github.event_name != 'workflow_dispatch' || inputs.public_bootstrap != true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: [11, 12, 13]
    steps:
      - uses: actions/checkout@v4
      - name: Full Debian systemd VM integration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
          env RELAY_DISPOSABLE_HOST=YES bash tests/test-debian-vm.sh '${{ matrix.version }}'
